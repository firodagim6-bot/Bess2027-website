<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BESS2027 - Official Portal</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f4f7fe;
            color: #2b2d42;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* HEADER STYLING */
        header {
            background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #415a77 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
        }

        /* LOGO STYLING */
        .header-logo {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        header h1 {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #4cc9f0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 16px;
            font-weight: 300;
            margin-top: 8px;
            letter-spacing: 2px;
            color: #e0e1dd;
            text-transform: uppercase;
        }

        /* MAIN CONTAINER */
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
        }

        /* CARD STYLING */
        .hero-card {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
        }

        .hero-card h2 {
            font-size: 26px;
            color: #1b263b;
            margin-bottom: 10px;
        }

        .hero-card p {
            color: #6c757d;
            font-size: 15px;
            margin-bottom: 20px;
        }

        /* BUTTON STYLING */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(45deg, #4361ee, #4cc9f0);
            color: white;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(67, 97, 238, 0.5);
        }

        /* PDF VIEWER CONTAINER */
        .pdf-box {
            width: 100%;
            height: 650px;
            border-radius: 15px;
            border: 2px solid #e0e1dd;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            background-color: #525659;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <img src="bess.jpg" alt="BESS Logo" class="header-logo">
        <h1>BESS2027</h1>
        <div class="subtitle">Official Student Portal</div>
    </header>

    <div class="container">
        <div class="hero-card">
            <h2>Kitaaba Dubbisaa</h2>
            <p>Kitaaba guutuu asuma irratti dubbisuu ykn gara Full Screen'tti jijjiiruudhaan ilaaluu dandeessu.</p>

            <!-- Qabduulee To'annoo -->
            <div class="btn-container">
                <a href="kitaaba.pdf" target="_blank" class="btn"><i class="fa-solid fa-arrow-up-right-from-square"></i> Tab Haaraatti Bani</a>
                <button class="btn" onclick="openFullscreen()"><i class="fa-solid fa-expand"></i> Full Screen</button>
            </div>

            <!-- Bakka Kitaabni (PDF) Itti Banamu -->
            <div class="pdf-box" id="pdfViewer">
                <iframe id="pdfFrame" src="kitaaba.pdf#toolbar=1&navpanes=0"></iframe>
            </div>
        </div>
    </div>

    <script>
        // Fullscreen Function
        function openFullscreen() {
            var elem = document.getElementById("pdfViewer");
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }
    </script>

</body>
</html>
