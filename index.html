<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BESS2027 - Official Portal</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f4f7fe;
            color: #2b2d42;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* HEADER STYLING */
        header {
            background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #415a77 100%);
            color: white;
            padding: 60px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
        }

        header h1 {
            font-size: 52px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #4cc9f0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 18px;
            font-weight: 300;
            margin-top: 8px;
            letter-spacing: 2px;
            color: #e0e1dd;
            text-transform: uppercase;
        }

        /* MAIN CONTAINER */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
        }

        /* CARD STYLING */
        .hero-card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
        }

        .hero-card h2 {
            font-size: 28px;
            color: #1b263b;
            margin-bottom: 15px;
        }

        .hero-card p {
            color: #6c757d;
            font-size: 16px;
            margin-bottom: 25px;
        }

        /* PDF VIEWER STYLING */
        .pdf-container {
            position: relative;
            width: 100%;
            height: 600px;
            margin-top: 20px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #e0e1dd;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .pdf-viewer {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* BUTTON STYLING */
        .btn-controls {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            background: linear-gradient(45deg, #4361ee, #4cc9f0);
            color: white;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(67, 97, 238, 0.6);
        }
    </style>
</head>
<body>

    <header>
        <h1>BESS2027</h1>
        <div class="subtitle">Official Student Portal</div>
    </header>

    <div class="container">
        <div class="hero-card">
            <h2>Kitaaba Dubbisaa</h2>
            <p>Kitaaba guutuu asuma irratti dubbisuu yookaan Full Screen gochuun ilaaluu dandeessu.</p>

            <div class="btn-controls">
                <!-- Button Skreenii Guutuu (Full Screen) Gochuuf -->
                <button class="btn" onclick="openFullscreen()">
                    <i class="fa-solid fa-expand"></i> Full Screen
                </button>
            </div>

            <!-- Iframe Kitaabni / PDF'n Keessatti Agarsiifamu -->
            <div class="pdf-container" id="pdfViewerContainer">
                <!-- Bakka 'sample.pdf' jedhutti linkii yookaan maqaa file PDF keetii galchi -->
                <iframe class="pdf-viewer" src="sample.pdf" id="pdfFrame"></iframe>
            </div>
        </div>
    </div>

    <script>
        // Kitaaba sana Full Screen gochuuf function kana fayyadamama
        function openFullscreen() {
            var elem = document.getElementById("pdfViewerContainer");
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }
    </script>

</body>
</html>
