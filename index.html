<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BESS2027 - Official Portal</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f4f7fe;
            color: #2b2d42;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* HEADER STYLING */
        header {
            background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #415a77 100%);
            color: white;
            padding: 60px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
        }

        header h1 {
            font-size: 52px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #4cc9f0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 18px;
            font-weight: 300;
            margin-top: 8px;
            letter-spacing: 2px;
            color: #e0e1dd;
            text-transform: uppercase;
        }

        /* MAIN CONTAINER */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
        }

        /* CARD STYLING */
        .hero-card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
        }

        .hero-card h2 {
            font-size: 28px;
            color: #1b263b;
            margin-bottom: 15px;
        }

        .hero-card p {
            color: #6c757d;
            font-size: 16px;
            margin-bottom: 25px;
        }

        /* BUTTON CONTROLS STYLING */
        .btn-controls {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(45deg, #4361ee, #4cc9f0);
            color: white;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(67, 97, 238, 0.5);
        }

        /* PDF VIEWER STYLING */
        .pdf-container {
            position: relative;
            width: 100%;
            height: 650px;
            margin-top: 10px;
            border-radius: 12px;
            overflow: auto; /* Scroll akka uumaamuuf */
            border: 2px solid #e0e1dd;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            background-color: #525659;
        }

        .pdf-viewer {
            width: 100%;
            height: 100%;
            border: none;
            transform-origin: top center;
            transition: transform 0.2s ease-in-out;
        }
    </style>
</head>
<body>

    <header>
        <h1>BESS2027</h1>
        <div class="subtitle">Official Student Portal</div>
    </header>

    <div class="container">
        <div class="hero-card">
            <h2>Kitaaba Dubbisaa</h2>
            <p>Kitaaba guutuu asuma irratti guddisaa yookaan xiqqeessaa dubbisuu dandeessu.</p>

            <!-- Qabduulee Zoom in, Zoom out, Reset fi Fullscreen -->
            <div class="btn-controls">
                <button class="btn" onclick="zoomIn()">
                    <i class="fa-solid fa-magnifying-glass-plus"></i> Zoom (+)
                </button>
                <button class="btn" onclick="zoomOut()">
                    <i class="fa-solid fa-magnifying-glass-minus"></i> Minimize (-)
                </button>
                <button class="btn" onclick="resetZoom()">
                    <i class="fa-solid fa-rotate-left"></i> Reset
                </button>
                <button class="btn" onclick="openFullscreen()">
                    <i class="fa-solid fa-expand"></i> Full Screen
                </button>
            </div>

            <!-- Box PDF Viewer -->
            <div class="pdf-container" id="pdfViewerContainer">
                <iframe class="pdf-viewer" src="sample.pdf#toolbar=1" id="pdfFrame"></iframe>
            </div>
        </div>
    </div>

    <script>
        let currentScale = 1;

        // Zoom In (+)
        function zoomIn() {
            currentScale += 0.15;
            applyZoom();
        }

        // Zoom Out (-)
        function zoomOut() {
            if (currentScale > 0.5) {
                currentScale -= 0.15;
                applyZoom();
            }
        }

        // Reset Zoom
        function resetZoom() {
            currentScale = 1;
            applyZoom();
        }

        // Apply scale style to iframe
        function applyZoom() {
            const iframe = document.getElementById('pdfFrame');
            iframe.style.transform = `scale(${currentScale})`;
            iframe.style.width = `${100 / currentScale}%`;
            iframe.style.height = `${100 / currentScale}%`;
        }

        // Fullscreen Function
        function openFullscreen() {
            var elem = document.getElementById("pdfViewerContainer");
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }
    </script>

</body>
</html>
